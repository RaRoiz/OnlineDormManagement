<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>เข้าสู่ระบบ | Online Dorm Management</title>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("dorm_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <header class="brand">
          <div class="brand-logo">
            <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M32 12.5 55 32.5a2.6 2.6 0 0 1-1.7 4.6H10.7A2.6 2.6 0 0 1 9 32.5z"/><rect x="16" y="31" width="32" height="21.5" rx="3.5"/><rect class="brand-mark-cut" x="20.5" y="35.5" width="7.5" height="7.5" rx="1.8"/><rect class="brand-mark-cut" x="36" y="35.5" width="7.5" height="7.5" rx="1.8"/><path class="brand-mark-cut" d="M27.5 46.5h9a1 1 0 0 1 1 1v5H26.5v-5a1 1 0 0 1 1-1z"/></svg>
          </div>

          <div class="brand-text">
            <h1>Online Dorm Management</h1>
            <p>ระบบจัดการหอพักออนไลน์</p>
          </div>
        </header>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">
              ชื่อผู้ใช้
            </label>

            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="กรอกชื่อผู้ใช้"
            />

            <small
              id="username-error"
              class="field-error"
            ></small>
          </div>

          <div class="form-group">
            <label for="password">
              รหัสผ่าน
            </label>

            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="กรอกรหัสผ่าน"
              />

              <button
                id="toggle-password"
                class="toggle-password"
                type="button"
              >
                แสดง
              </button>
            </div>

            <small
              id="password-error"
              class="field-error"
            ></small>
          </div>

          <div
            id="login-message"
            class="login-message"
            role="alert"
            aria-live="polite"
          ></div>

          <button
            id="login-button"
            class="login-button"
            type="submit"
          >
            <span id="login-button-text">
              เข้าสู่ระบบ
            </span>

            <span
              id="login-spinner"
              class="spinner hidden"
            ></span>
          </button>

<div class="register-section">
  <span>ยังไม่มีบัญชีผู้ใช้?</span>

  <a
    class="register-link"
    href="/src/pages/register/register.html"
  >
    สมัครสมาชิก
  </a>
</div>


        </form>
      </section>
    </main>

    <script
      type="module"
      src="/src/pages/login/login.ts"
    ></script>
  </body>
</html>
